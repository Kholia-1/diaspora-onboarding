<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion back-office</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --red: #C90000;
            --red-dark: #9E0000;
            --black: #111111;
            --white: #FFFFFF;
            --gray-bg: #F4F6F9;
            --border: #DADDE5;
            --muted: #6B7280;
        }

        /* BACKOFFICE_LOGIN_PREMIUM_V1 — même langage visuel que le back-office */
        body {
            margin: 0;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            /* Fond gris premium : dégradé gris clair + léger halo blanc et une pointe
               discrète de rouge de marque. */
            background:
                radial-gradient(1000px 500px at 78% -140px, rgba(255, 255, 255, 0.65), transparent 60%),
                radial-gradient(760px 420px at -10% 115%, rgba(201, 0, 0, 0.05), transparent 60%),
                linear-gradient(160deg, #eef0f4 0%, #e5e8ee 55%, #d7dae1 100%);
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        ::selection {
            background: rgba(201, 0, 0, 0.25);
            color: #fff;
        }

        .header {
            background: #0b0c0f;
            color: var(--white);
            padding: 16px 30px;
            border-bottom: 3px solid var(--red);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .header strong {
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .header img {
            height: 38px;
            background: var(--white);
            border-radius: 10px;
            padding: 5px 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
        }

        .wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 36px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin: 0 0 6px;
            color: #0B1220;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        h1::after {
            content: "";
            display: block;
            width: 44px;
            height: 4px;
            border-radius: 4px;
            margin-top: 10px;
            background: linear-gradient(90deg, var(--red), #F0A5A5);
        }

        .subtitle {
            color: var(--muted);
            font-size: 13.5px;
            line-height: 1.55;
            margin: 14px 0 24px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 6px;
            color: #1F2937;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #D3D9E4;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 16px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--red);
            box-shadow: 0 0 0 4px rgba(201, 0, 0, 0.14);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #E01414, var(--red-dark));
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px 16px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            font-family: inherit;
            box-shadow: 0 10px 22px rgba(201, 0, 0, 0.35);
            transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease;
        }

        button:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(201, 0, 0, 0.42);
        }

        button:active {
            transform: translateY(0);
        }

        button:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px rgba(201, 0, 0, 0.30);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .error {
            background: #FEE2E2;
            color: #991B1B;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>

<div class="header">
    <strong>First Diaspora Onboarding — Back-office</strong>
    <img src="/static/afriland-logo.png" alt="Afriland First Bank" onerror="this.style.display='none'">
</div>

<div class="wrap">
    <form class="card" id="loginForm" novalidate>
        <h1>Connexion</h1>
        <p class="subtitle">Accès réservé aux utilisateurs habilités. Toutes les actions sont journalisées.</p>

        <div class="error" id="loginError" role="alert"></div>

        <label for="username">Identifiant</label>
        <input id="username" type="text" autocomplete="username" required autofocus>

        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <button type="submit" id="loginBtn">Se connecter</button>
    </form>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const btn = document.getElementById("loginBtn");
        const errorBox = document.getElementById("loginError");

        errorBox.classList.remove("show");
        btn.disabled = true;
        btn.textContent = "Connexion en cours...";

        try {
            const response = await fetch("/api/backoffice/auth/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    username: document.getElementById("username").value.trim(),
                    password: document.getElementById("password").value
                })
            });

            const data = await response.json().catch(function () { return {}; });

            if (!response.ok || !data.ok) {
                errorBox.textContent = data.detail || "Identifiants incorrects.";
                errorBox.classList.add("show");
                return;
            }

            window.location.href = "/backoffice/applications";

        } catch (err) {
            errorBox.textContent = "Erreur technique. Veuillez réessayer.";
            errorBox.classList.add("show");
        } finally {
            btn.disabled = false;
            btn.textContent = "Se connecter";
        }
    });
</script>

</body>
</html>
