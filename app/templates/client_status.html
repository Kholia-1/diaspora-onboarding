<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivre ma demande</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7eeee;color:#21191b}.page{max-width:620px;margin:auto;padding:24px 18px}.card{background:#fff;border:1px solid #ead7d7;border-radius:18px;padding:20px;margin:16px 0}.hero{background:linear-gradient(135deg,#21191b,#c90000);color:#fff;border-radius:22px;padding:22px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;margin:8px 0 14px}input{border:1px solid #d1d5db}button{border:0;background:#c90000;color:#fff;font-weight:700}a{color:#c90000;text-decoration:none;font-weight:700}.hidden{display:none}.badge{display:inline-block;padding:8px 12px;border-radius:999px;background:#f3f4f6;font-weight:700}.ok{background:#dcfce7;color:#166534}.review{background:#fef3c7;color:#b45309}.bad{background:#fee2e2;color:#c90000}.info{background:#f9fafb;border:1px solid #edf0f3;border-radius:12px;padding:12px;margin-top:10px}.rib{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="page">
<p><a href="/?v=24">Retour accueil</a></p>
<div class="hero"><h1>Suivre ma demande</h1><p>Entrez la reference du dossier et l'email utilise lors de la demande.</p></div>
<div class="card">
<label>Reference de demande</label><input id="reference" placeholder="Ex : AFB-DIASPORA-2026-0001">
<label>Email</label><input id="email" type="email" placeholder="Ex : client@email.com">
<button type="button" onclick="checkStatus()">Consulter le statut</button><p id="message"></p>
</div>
<div id="result" class="card hidden">
<h2>Resultat du suivi</h2><span id="status" class="badge">...</span>
<div class="info"><b>Reference</b><br><span id="refValue">-</span></div>
<div class="info"><b>Client</b><br><span id="clientValue">-</span></div>
<div class="info"><b>Score documentaire</b><br><span id="docScoreValue">-</span></div>
<div class="info"><b>BlackModule</b><br><span id="blackmoduleValue">-</span></div>
<div class="info"><b>Message de la banque</b><br><span id="clientMessageValue">-</span></div>
<div id="ribBlock" class="hidden"><h3>RIB Afriland attribue</h3><div id="ribValue" class="rib"></div></div>
</div></div>
<script>
function labelStatus(s){const l={SUBMITTED:"Demande soumise",COMPLIANCE_REVIEW:"En revue conformite",NEED_MORE_DOCUMENTS:"Documents complementaires requis",APPROVED:"Dossier approuve",REJECTED:"Dossier rejete",ACCOUNT_OPENED:"Compte ouvert / RIB attribue",BLACKMODULE_ALERT:"Revue conformite requise"};return l[s]||s||"Non defini";}
function classStatus(s){if(s==="ACCOUNT_OPENED"||s==="APPROVED")return"badge ok";if(s==="REJECTED")return"badge bad";if(s==="COMPLIANCE_REVIEW"||s==="NEED_MORE_DOCUMENTS"||s==="BLACKMODULE_ALERT")return"badge review";return"badge";}
async function checkStatus(){const ref=document.getElementById("reference").value.trim();const email=document.getElementById("email").value.trim();const msg=document.getElementById("message");const result=document.getElementById("result");result.classList.add("hidden");if(!ref||!email){msg.style.color="#c90000";msg.innerText="Veuillez renseigner la reference et l'email.";return;}msg.style.color="#6b7280";msg.innerText="Recherche du dossier...";try{const res=await fetch("/api/applications/status/"+encodeURIComponent(ref)+"?email="+encodeURIComponent(email));if(!res.ok){msg.style.color="#c90000";msg.innerText="Dossier introuvable ou informations incorrectes.";return;}const data=await res.json();const st=document.getElementById("status");st.className=classStatus(data.status);st.innerText=labelStatus(data.status);document.getElementById("refValue").innerText=data.reference||"-";document.getElementById("clientValue").innerText=((data.first_name||"")+" "+(data.last_name||"")).trim()||"-";document.getElementById("docScoreValue").innerText=Number(data.document_score||0)+"%";document.getElementById("blackmoduleValue").innerText=data.blackmodule_status||"NOT_SCREENED";document.getElementById("clientMessageValue").innerText=data.client_message||data.review_comment||"Votre dossier est en cours de traitement.";if(data.status==="ACCOUNT_OPENED"&&data.final_rib){document.getElementById("ribBlock").classList.remove("hidden");document.getElementById("ribValue").innerText=data.final_rib;}else{document.getElementById("ribBlock").classList.add("hidden");}msg.innerText="";result.classList.remove("hidden");}catch(e){msg.style.color="#c90000";msg.innerText="Erreur de connexion. Veuillez reessayer.";}}
</script></body></html>
