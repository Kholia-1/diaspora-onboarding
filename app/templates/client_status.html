<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Suivi de dossier - First Diaspora Onboarding</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/static/afriland-logo.png">

    <style>
        :root {
            --red: #C90000;
            --red-dark: #9E0000;
            --black: #111111;
            --gray-bg: #F4F6F9;
            --border: #DADDE5;
            --muted: #6B7280;
            --green: #166534;
            --orange: #B45309;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--gray-bg);
            color: #111827;
        }

        /* CLIENT_STATUS_TOPBAR_ALIGNED_V1 : même header que le portail principal */
        .topbar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            min-height: 96px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .brand-logo {
            width: 180px;
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .brand-logo img {
            width: 180px;
            height: 78px;
            object-fit: contain;
            object-position: left center;
            display: block;
        }

        .topnav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1 1 auto;
            min-width: 0;
            flex-wrap: wrap;
        }

        .topnav a {
            text-decoration: none;
            color: #111827;
            font-weight: 800;
            font-size: 14px;
            padding: 10px 14px;
            border-radius: 999px;
            white-space: nowrap;
            transition: 0.15s ease;
        }

        .topnav a:hover {
            background: rgba(201, 0, 0, 0.08);
            color: var(--red);
        }

        .topnav a.active {
            background: var(--red);
            color: white;
        }

        /* AFB_MOBILE_BURGER_NAV_V1 : bouton hamburger (repris du parcours d'ouverture) */
        .nav-toggle {
            display: none;
            background: #fff;
            border: 1px solid #f0c3c6;
            border-radius: 12px;
            padding: 8px 10px;
            cursor: pointer;
            flex: 0 0 auto;
        }

        .nav-toggle span {
            display: block;
            width: 22px;
            height: 3px;
            border-radius: 3px;
            background: var(--red);
            margin: 4px 0;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .nav-toggle[aria-expanded="true"] span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .nav-toggle[aria-expanded="true"] span:nth-child(2) {
            opacity: 0;
        }

        .nav-toggle[aria-expanded="true"] span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .container {
            max-width: 920px;
            margin: 35px auto;
            padding: 0 18px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 26px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            border: 1px solid #EEF0F5;
        }

        h1 {
            margin-top: 0;
            color: var(--red);
        }

        .muted {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
        }

        .hint {
            color: var(--muted);
            font-size: 13px;
            margin-top: 6px;
        }

        .btn {
            margin-top: 20px;
            background: var(--red);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px 18px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .btn:hover {
            background: var(--red-dark);
        }

        .result {
            margin-top: 22px;
        }

        .status-card {
            border: 1px solid #e5e7eb;
            border-left: 6px solid var(--red);
            border-radius: 14px;
            padding: 16px;
            background: #ffffff;
            margin-top: 14px;
        }

        .status-card h3 {
            margin: 0 0 10px;
            color: var(--red);
        }

        .status-card p {
            margin: 7px 0;
            line-height: 1.45;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-ok {
            background: #DCFCE7;
            color: #166534;
        }

        .badge-review {
            background: #FEF3C7;
            color: #92400E;
        }

        .badge-alert {
            background: #FEE2E2;
            color: #991B1B;
        }

        .badge-default {
            background: #E5E7EB;
            color: #374151;
        }

        .error {
            background: #FEF2F2;
            color: #991B1B;
            border: 1px solid #FECACA;
            border-radius: 12px;
            padding: 14px;
            margin-top: 16px;
            font-weight: bold;
        }

        .loading {
            color: var(--muted);
            font-weight: bold;
            margin-top: 16px;
        }

        @media (max-width: 980px) {
            .nav-toggle {
                display: block;
                margin-left: auto;
            }

            .topbar {
                flex-wrap: nowrap;
                gap: 10px;
            }

            .brand {
                flex: 1 1 auto;
                min-width: 0;
                gap: 10px;
            }

            /* Le menu devient un panneau déroulant sous le header */
            .topnav {
                display: none;
                position: absolute;
                left: 0;
                right: 0;
                top: 100%;
                background: #fff;
                border-bottom: 1px solid var(--border);
                box-shadow: 0 20px 32px rgba(15, 23, 42, 0.14);
                padding: 14px 18px 18px;
                flex-direction: column;
                align-items: stretch;
                justify-content: flex-start;
                gap: 10px;
                flex-wrap: nowrap;
            }

            .topnav.open {
                display: flex;
            }

            .topnav a {
                display: block;
                text-align: center;
                font-size: 15px;
                padding: 12px 14px;
                white-space: normal;
            }
        }

        @media (max-width: 700px) {
            .topbar {
                padding: 8px 4%;
                min-height: 0;
                gap: 10px;
            }

            .brand-logo,
            .brand-logo img {
                width: 140px;
                height: 60px;
            }

            /* CLIENT_STATUS_MOBILE_NO_CARD_V1 : formulaire sans carte sur mobile */
            .container > .card {
                background: transparent;
                border: none;
                box-shadow: none;
                border-radius: 0;
                padding: 0;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-logo">
            <img src="/static/afriland-logo.png" alt="Afriland First Bank">
        </div>
    </div>

    <nav class="topnav" id="topnavMenu" aria-label="Menu des services">
        <a href="/">Accueil</a>
        <a href="/open-account-flow-test">Ouverture de compte</a>
        <a href="/souscrire-carte">Carte bancaire</a>
        <a href="/recharger-carte">Recharge de carte</a>
        <a href="/client/status" class="active" aria-current="page">Suivre ma demande</a>
    </nav>

    <!-- AFB_MOBILE_BURGER_NAV_V1 : bouton hamburger (visible <= 980px) -->
    <button type="button" class="nav-toggle" id="navToggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="topnavMenu">
        <span></span>
        <span></span>
        <span></span>
    </button>
</header>

<script>
/* AFB_MOBILE_BURGER_NAV_V1 : ouverture/fermeture du menu mobile */
(function () {
    var btn = document.getElementById("navToggle");
    var nav = document.getElementById("topnavMenu");
    if (!btn || !nav) return;

    function setOpen(open) {
        nav.classList.toggle("open", open);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        btn.setAttribute("aria-label", open ? "Fermer le menu" : "Ouvrir le menu");
    }

    btn.addEventListener("click", function () {
        setOpen(!nav.classList.contains("open"));
    });

    nav.addEventListener("click", function (event) {
        if (event.target.closest("a")) setOpen(false);
    });

    document.addEventListener("click", function (event) {
        if (!nav.classList.contains("open")) return;
        if (event.target.closest(".topbar")) return;
        setOpen(false);
    });
})();
</script>

<div class="container">
    <div class="card">
        <h1>Suivi de votre demande</h1>

        <p class="muted">
            Saisissez l’email ou le numéro de téléphone utilisé lors de la demande :
            nous retrouverons le ou les dossiers correspondants.
        </p>

        <form id="statusForm">
            <label for="identifier">Email ou numéro de téléphone <span style="color:#C90000">*</span></label>
            <input id="identifier" name="identifier" type="text" placeholder="exemple@email.com ou +237 6XX XX XX XX" autocomplete="on" required>

            <button class="btn" type="submit">Rechercher mon dossier</button>
        </form>

        <div id="statusResult" class="result"></div>
    </div>
</div>

<script>
/* CLIENT_STATUS_CONTACT_SINGLE_FIELD_V1 (ex EMAIL_ONLY_CLEAN_V2) */
(function () {
    const form = document.getElementById("statusForm");
    const identifierInput = document.getElementById("identifier");
    const resultBox = document.getElementById("statusResult");

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function statusLabel(status) {
        const labels = {
            "SUBMITTED": "Dossier soumis",
            "AUTO_KYC_OK": "KYC automatique validé",
            "AUTO_KYC_REVIEW": "KYC en revue",
            "BLACKMODULE_ALERT": "Alerte conformité",
            "COMPLIANCE_REVIEW": "Revue conformité",
            "APPROVED": "Dossier approuvé",
            "REJECTED": "Dossier rejeté",
            "NEED_MORE_DOCUMENTS": "Complément demandé",
            "ACCOUNT_OPENED": "Compte ouvert"
        };

        return labels[status] || status || "Non défini";
    }

    function badgeClass(status) {
        if (["APPROVED", "AUTO_KYC_OK", "ACCOUNT_OPENED"].includes(status)) {
            return "badge-ok";
        }

        if (["AUTO_KYC_REVIEW", "COMPLIANCE_REVIEW", "NEED_MORE_DOCUMENTS"].includes(status)) {
            return "badge-review";
        }

        if (["BLACKMODULE_ALERT", "REJECTED"].includes(status)) {
            return "badge-alert";
        }

        return "badge-default";
    }

    function renderApplication(app) {
        return `
            <div class="status-card">
                <h3>Dossier ${escapeHtml(app.reference)}</h3>

                <p>
                    <strong>Statut :</strong>
                    <span class="badge ${badgeClass(app.status)}">${escapeHtml(statusLabel(app.status))}</span>
                </p>

                <p><strong>Client :</strong> ${escapeHtml(app.full_name || "")}</p>
                <p><strong>Email :</strong> ${escapeHtml(app.email || "")}</p>
                <p><strong>Téléphone :</strong> ${escapeHtml(app.phone || "Non renseigné")}</p>
                <p><strong>Agence souhaitée :</strong> ${escapeHtml(app.preferred_branch || "Non renseignée")}</p>
                <p><strong>Nationalité :</strong> ${escapeHtml(app.nationality || "Non renseignée")}</p>
                <p><strong>Score KYC :</strong> ${escapeHtml(app.kyc_score ?? 0)}%</p>
                <p><strong>Score documentaire :</strong> ${escapeHtml(app.document_score ?? 0)}%</p>

                ${app.account_number ? `<p><strong>Numéro de compte :</strong> ${escapeHtml(app.account_number)}</p>` : ""}
                ${app.final_rib ? `<p><strong>RIB final :</strong> ${escapeHtml(app.final_rib)}</p>` : ""}
                ${app.client_message ? `<p><strong>Message banque :</strong> ${escapeHtml(app.client_message)}</p>` : ""}
                ${app.review_comment ? `<p><strong>Observation :</strong> ${escapeHtml(app.review_comment)}</p>` : ""}
            </div>
        `;
    }

    function renderApplications(data) {
        const apps = data.applications || [];

        if (!apps.length) {
            resultBox.innerHTML = `<div class="error">Aucun dossier trouvé pour ce contact.</div>`;
            return;
        }

        resultBox.innerHTML = `
            <p class="muted">
                <strong>${apps.length}</strong> dossier(s) trouvé(s) pour <strong>${escapeHtml(data.identifier || data.email || "")}</strong>.
            </p>
            ${apps.map(renderApplication).join("")}
        `;
    }

    async function searchStatus(event) {
        event.preventDefault();

        const identifier = identifierInput.value.trim();

        if (!identifier) {
            resultBox.innerHTML = `<div class="error">Veuillez saisir votre email ou votre numéro de téléphone.</div>`;
            return;
        }

        resultBox.innerHTML = `<div class="loading">Recherche en cours...</div>`;

        try {
            const url = `/api/applications/status-by-contact?identifier=${encodeURIComponent(identifier)}`;

            const response = await fetch(url, {
                cache: "no-store"
            });

            if (!response.ok) {
                let detail = "Aucun dossier trouvé avec ces informations.";

                try {
                    const errorData = await response.json();
                    detail = errorData.detail || detail;
                } catch (e) {}

                throw new Error(detail);
            }

            const data = await response.json();

            if (data.applications) {
                renderApplications(data);
            } else {
                resultBox.innerHTML = renderApplication(data);
            }
        } catch (error) {
            resultBox.innerHTML = `
                <div class="error">
                    ${escapeHtml(error.message || "Impossible de retrouver le dossier.")}
                </div>
            `;
        }
    }

    // CLIENT_STATUS_CONTACT_SINGLE_FIELD_V1 : le rendu détaillé (V3 plus bas) gère la soumission.
    // Ce handler ne sert que de secours si le script V3 n'a pas été chargé.
    document.addEventListener("DOMContentLoaded", function () {
        if (!window.__clientStatusV3Active) {
            form.addEventListener("submit", searchStatus);
        }
    });
})();
</script>

<script>
/* CLIENT_STATUS_VISUAL_TRACKING_V3 */
(function () {
    if (window.__clientStatusVisualTrackingV3) return;
    window.__clientStatusVisualTrackingV3 = true;

    // Signale au premier script que ce gestionnaire prend en charge la soumission du formulaire.
    window.__clientStatusV3Active = true;

    function escapeHtmlV3(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function statusLabelV3(status) {
        const labels = {
            "SUBMITTED": "Dossier soumis",
            "AUTO_KYC_OK": "KYC automatique validé",
            "AUTO_KYC_REVIEW": "KYC en revue",
            "BLACKMODULE_ALERT": "Alerte conformité",
            "COMPLIANCE_REVIEW": "Revue conformité",
            "APPROVED": "Dossier approuvé",
            "REJECTED": "Dossier rejeté",
            "NEED_MORE_DOCUMENTS": "Complément demandé",
            "ACCOUNT_OPENED": "Compte ouvert"
        };

        return labels[status] || status || "Non défini";
    }

    function progressForStatus(status) {
        const map = {
            "SUBMITTED": 20,
            "AUTO_KYC_REVIEW": 40,
            "AUTO_KYC_OK": 55,
            "BLACKMODULE_ALERT": 55,
            "COMPLIANCE_REVIEW": 65,
            "NEED_MORE_DOCUMENTS": 55,
            "APPROVED": 85,
            "ACCOUNT_OPENED": 100,
            "REJECTED": 100
        };

        return map[status] || 20;
    }

    function stepClass(status, step) {
        const progress = progressForStatus(status);

        if (status === "REJECTED" && step >= 4) return "blocked";
        if (status === "NEED_MORE_DOCUMENTS" && step === 3) return "current";
        if (status === "BLACKMODULE_ALERT" && step === 3) return "current";

        const thresholds = {
            1: 20,
            2: 40,
            3: 65,
            4: 85,
            5: 100
        };

        if (progress >= thresholds[step]) return "done";

        const previous = step === 1 ? 0 : thresholds[step - 1];
        if (progress >= previous && progress < thresholds[step]) return "current";

        return "";
    }

    function renderStep(app, step, title, text) {
        const cls = stepClass(app.status, step);
        const icon = cls === "done" ? "✓" : step;

        return `
            <div class="tracking-step ${cls}">
                <div class="tracking-step-icon">${icon}</div>
                <div>
                    <h4>${escapeHtmlV3(title)}</h4>
                    <p>${escapeHtmlV3(text)}</p>
                </div>
            </div>
        `;
    }

    function renderTrackingDetailsV3(app) {
        const progress = progressForStatus(app.status);

        const bankMessage = app.client_message || app.review_comment || "";
        const finalInfo = app.account_number || app.final_rib;

        return `
            <div class="tracking-summary">
                <h2>${escapeHtmlV3(statusLabelV3(app.status))}</h2>
                <p>Bonjour ${escapeHtmlV3(app.full_name || "client")}, voici l’état actuel de votre demande.</p>
                <span class="tracking-ref">${escapeHtmlV3(app.reference)}</span>

                <div class="tracking-grid">
                    <div class="tracking-mini-card">
                        <span>Email</span>
                        <strong>${escapeHtmlV3(app.email || "Non renseigné")}</strong>
                    </div>
                    <div class="tracking-mini-card">
                        <span>Agence souhaitée</span>
                        <strong>${escapeHtmlV3(app.preferred_branch || "Non renseignée")}</strong>
                    </div>
                    <div class="tracking-mini-card">
                        <span>Niveau de risque</span>
                        <strong>${escapeHtmlV3(app.risk_level || "Non évalué")}</strong>
                    </div>
                </div>
            </div>

            <div class="tracking-progress-box">
                <div class="tracking-progress-header">
                    <h3>Avancement de votre dossier</h3>
                    <span class="tracking-percent">${progress}%</span>
                </div>

                <div class="tracking-bar">
                    <div class="tracking-bar-fill" style="width:${progress}%"></div>
                </div>

                <div class="tracking-steps">
                    ${renderStep(app, 1, "Dossier soumis", "Votre demande a été enregistrée dans le système.")}
                    ${renderStep(app, 2, "Analyse KYC et documents", "Les informations client et les pièces transmises sont en cours de contrôle.")}
                    ${renderStep(app, 3, "Revue conformité", "Le dossier peut être validé automatiquement ou transmis à la conformité si nécessaire.")}
                    ${renderStep(app, 4, "Décision banque", "Un agent analyse le dossier et prend une décision back-office.")}
                    ${renderStep(app, 5, "Compte ouvert", "Lorsque le compte est ouvert, les informations finales peuvent être communiquées au client.")}
                </div>

                ${bankMessage ? `
                    <div class="tracking-bank-message">
                        <strong>Message de la banque</strong>
                        ${escapeHtmlV3(bankMessage)}
                    </div>
                ` : ""}

                ${finalInfo ? `
                    <div class="tracking-bank-message">
                        <strong>Informations de compte</strong>
                        ${app.account_number ? `Numéro de compte : ${escapeHtmlV3(app.account_number)}<br>` : ""}
                        ${app.final_rib ? `RIB final : ${escapeHtmlV3(app.final_rib)}` : ""}
                    </div>
                ` : ""}
            </div>
        `;
    }

    function renderSmallCardV3(app, index) {
        return `
            <div class="tracking-status-card">
                <h3>${escapeHtmlV3(app.reference)}</h3>
                <p><strong>Statut :</strong> ${escapeHtmlV3(statusLabelV3(app.status))}</p>
                <p><strong>Client :</strong> ${escapeHtmlV3(app.full_name || "")}</p>
                <p><strong>Agence :</strong> ${escapeHtmlV3(app.preferred_branch || "Non renseignée")}</p>
                <p><strong>Score KYC :</strong> ${escapeHtmlV3(app.kyc_score ?? 0)}%</p>
                <p><strong>Score documentaire :</strong> ${escapeHtmlV3(app.document_score ?? 0)}%</p>

                <div class="tracking-card-actions">
                    <button type="button" onclick="window.__showTrackingDetailsV3(${index})">
                        Voir le détail du suivi
                    </button>
                </div>
            </div>
        `;
    }

    window.__lastTrackingAppsV3 = [];

    window.__showTrackingDetailsV3 = function (index) {
        const resultBox = document.getElementById("statusResult");
        const app = window.__lastTrackingAppsV3[index];

        if (!resultBox || !app) return;

        resultBox.innerHTML =
            renderTrackingDetailsV3(app) +
            `<h3 class="tracking-list-title">Autres dossiers associés à ce contact</h3>` +
            window.__lastTrackingAppsV3
                .map(renderSmallCardV3)
                .join("");

        resultBox.scrollIntoView({ behavior: "smooth", block: "start" });
    };

    async function improvedSearch(event) {
        const form = document.getElementById("statusForm");
        const identifierInput = document.getElementById("identifier");
        const resultBox = document.getElementById("statusResult");

        if (!form || !identifierInput || !resultBox) return;

        event.preventDefault();
        event.stopImmediatePropagation();

        const identifier = identifierInput.value.trim();

        if (!identifier) {
            resultBox.innerHTML = `<div class="error">Veuillez saisir votre email ou votre numéro de téléphone.</div>`;
            return;
        }

        resultBox.innerHTML = `<div class="loading">Recherche en cours...</div>`;

        try {
            const url = `/api/applications/status-by-contact?identifier=${encodeURIComponent(identifier)}`;

            const response = await fetch(url, { cache: "no-store" });

            if (!response.ok) {
                let detail = "Aucun dossier trouvé avec ces informations.";

                try {
                    const errorData = await response.json();
                    detail = errorData.detail || detail;
                } catch (e) {}

                throw new Error(detail);
            }

            const data = await response.json();

            let apps = [];

            if (data.applications) {
                apps = data.applications;
            } else {
                apps = [data];
            }

            window.__lastTrackingAppsV3 = apps;

            if (apps.length === 1) {
                resultBox.innerHTML = renderTrackingDetailsV3(apps[0]);
                return;
            }

            resultBox.innerHTML = `
                <h3 class="tracking-list-title">${apps.length} dossier(s) trouvé(s) pour ${escapeHtmlV3(identifier)}</h3>
                <p class="muted">Sélectionnez un dossier pour afficher son suivi détaillé.</p>
                ${apps.map(renderSmallCardV3).join("")}
            `;
        } catch (error) {
            resultBox.innerHTML = `
                <div class="error">
                    ${escapeHtmlV3(error.message || "Impossible de retrouver le dossier.")}
                </div>
            `;
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("statusForm");

        if (!form) return;

        form.addEventListener("submit", improvedSearch, true);
    });
})();
</script>

<script>
(function () {
    if (window.__clientStatusPaymentSafeV1) return;
    window.__clientStatusPaymentSafeV1 = true;

    function normalizeText(value) {
        return String(value || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/\s+/g, " ")
            .trim()
            .toLowerCase();
    }

    function createPaymentInfoCard() {
        const card = document.createElement("div");
        card.className = "payment-client-safe-card";
        card.innerHTML = `
            <strong>Paiement en attente de validation</strong>
            <p>Après validation de votre dossier, la banque vous transmettra un lien de paiement sécurisé par SMS, WhatsApp ou e-mail.</p>
        `;
        return card;
    }

    function protectPaymentArea() {
        document.querySelectorAll("button, a").forEach(function (el) {
            const text = normalizeText(el.textContent);

            if (
                text.includes("generer le lien de paiement") ||
                text.includes("paiement en attente de validation")
            ) {
                const card = createPaymentInfoCard();
                el.replaceWith(card);
            }
        });

        document.querySelectorAll("*").forEach(function (el) {
            if (!el.childNodes || el.childNodes.length !== 1) return;

            const child = el.childNodes[0];
            if (!child || child.nodeType !== Node.TEXT_NODE) return;

            const raw = child.textContent || "";
            const normalized = normalizeText(raw);

            if (normalized.includes("le lien de paiement sera genere par la banque apres validation du dossier")) {
                child.textContent = "Après validation de votre dossier, la banque vous transmettra un lien de paiement sécurisé par SMS, WhatsApp ou e-mail.";
            }
        });
    }

    document.addEventListener("click", function (event) {
        const target = event.target.closest ? event.target.closest("button, a") : null;
        if (!target) return;

        const text = normalizeText(target.textContent);

        if (
            text.includes("generer le lien de paiement") ||
            text.includes("paiement en attente de validation")
        ) {
            event.preventDefault();
            event.stopPropagation();
            protectPaymentArea();
        }
    }, true);

    document.addEventListener("DOMContentLoaded", function () {
        protectPaymentArea();

        let count = 0;
        const timer = setInterval(function () {
            protectPaymentArea();
            count += 1;

            if (count >= 10) {
                clearInterval(timer);
            }
        }, 600);

        setTimeout(protectPaymentArea, 1500);
        setTimeout(protectPaymentArea, 3000);
    });
})();
</script>

<script>
(function () {
    function getPaymentOrderId() {
        try {
            const params = new URLSearchParams(window.location.search);
            return params.get("payment_order_id") || "";
        } catch (e) {
            return "";
        }
    }

    function createBanner(payment) {
        const paid = payment && payment.paid === true;
        const amount = payment && payment.amount_captured ? payment.amount_captured : "";
        const currency = payment && payment.currency ? payment.currency : "";
        const orderId = payment && payment.order_id ? payment.order_id : "";
        const receipt = payment && payment.receipt ? payment.receipt : "";
        const card = payment && payment.masked_card ? payment.masked_card : "";

        const box = document.createElement("div");
        box.id = "mastercardPaymentClientBanner";
        box.style.maxWidth = "980px";
        box.style.margin = "18px auto";
        box.style.padding = "18px 20px";
        box.style.borderRadius = "16px";
        box.style.boxShadow = "0 10px 30px rgba(15, 23, 42, 0.10)";
        box.style.fontFamily = "Arial, sans-serif";

        if (paid) {
            box.style.background = "#ecfdf3";
            box.style.border = "1px solid #22c55e";

            box.innerHTML = `

                    Paiement confirmé
                </div>
                <div style="font-size:15px;line-height:1.55;">
                    Votre paiement de <strong>${amount} ${currency}</strong> a été confirmé avec succès.
                    Votre dossier est en cours de mise à jour.
                </div>
                <div style="margin-top:10px;font-size:13px;color:#065f46;">
                    Référence paiement : <strong>${orderId}</strong>
                    ${receipt ? " · Reçu : <strong>" + receipt + "</strong>" : ""}
                    ${card ? " · Carte : <strong>" + card + "</strong>" : ""}
                </div>
            `;
        } else {
            box.style.background = "#fff7df";
            box.style.border = "1px solid #facc15";
            box.style.color = "#78350f";
            box.innerHTML = `
                <div style="font-size:20px;font-weight:800;margin-bottom:8px;">
                    Vérification du paiement en cours
                </div>
                <div style="font-size:15px;line-height:1.55;">
                    Nous avons reçu votre retour de paiement. La confirmation finale est en cours de vérification.
                </div>
            `;
        }

        return box;
    }

    async function loadPaymentStatus() {
        const orderId = getPaymentOrderId();
        if (!orderId) return;

        try {
            const response = await fetch("/api/payments/mastercard/records/latest?order_id=" + encodeURIComponent(orderId));
            const data = await response.json();

            const banner = createBanner(data && data.payment ? data.payment : null);

            const target = document.body;
            if (!target) return;

            target.insertBefore(banner, target.firstChild);

        } catch (e) {
            const banner = createBanner(null);
            if (document.body) {
                document.body.insertBefore(banner, document.body.firstChild);
            }
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadPaymentStatus);
    } else {
        loadPaymentStatus();
    }
})();
</script>


<script>
/* CLIENT_SELF_PAYMENT_LINK_PANEL_V1 */
(function () {
    function findApplicationReference() {
        const params = new URLSearchParams(window.location.search);

        const keys = ["reference", "ref", "application_reference", "dossier"];

        for (const key of keys) {
            const value = params.get(key);
            if (value && value.startsWith("DIA-")) {
                return value.trim();
            }
        }

        const bodyText = document.body.innerText || "";
        const match = bodyText.match(/DIA-\d{8}-[A-Z0-9]+/);
        return match ? match[0] : null;
    }

    function createPaymentPanel(reference) {
        const wrapper = document.createElement("div");
        wrapper.id = "clientSelfPaymentLinkPanel";
        wrapper.style.cssText = "margin:18px 0;padding:18px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);";

        wrapper.innerHTML = `
            <h3 style="margin:0 0 8px 0;color:#b00020;">Paiement du package</h3>
            <p style="margin:0 0 12px 0;color:#555;">
                Si votre dossier est approuvé et qu’un paiement est requis, vous pouvez récupérer votre lien de paiement sécurisé Mastercard ici.
            </p>

            <div style="margin-bottom:10px;">
                <label style="font-weight:700;">Référence dossier</label>
                <input id="clientPaymentReferenceInput" value="${reference || ""}" readonly
                    style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:5px;">
            </div>

            <div style="margin-bottom:10px;">
                <label style="font-weight:700;">Email ou téléphone utilisé dans le dossier</label>
                <input id="clientPaymentIdentifierInput" placeholder="Ex: email@domaine.com ou +2376..."
                    style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:5px;">
            </div>

            <button id="clientGeneratePaymentLinkBtn" type="button"
                style="padding:10px 14px;border:0;border-radius:8px;background:#D22630;color:#fff;font-weight:700;cursor:pointer;">
                Afficher mon lien de paiement
            </button>

            <div id="clientPaymentLinkResult" style="margin-top:14px;"></div>
        `;

        return wrapper;
    }

    async function generatePaymentLink() {
        const reference = document.getElementById("clientPaymentReferenceInput").value.trim();
        const identifier = document.getElementById("clientPaymentIdentifierInput").value.trim();
        const resultBox = document.getElementById("clientPaymentLinkResult");

        if (!reference) {
            resultBox.innerHTML = `<div style="color:#dc3545;">Référence dossier introuvable.</div>`;
            return;
        }

        if (!identifier) {
            resultBox.innerHTML = `<div style="color:#dc3545;">Veuillez saisir votre email ou téléphone pour vérifier le dossier.</div>`;
            return;
        }

        resultBox.innerHTML = `<div style="color:#555;">Génération du lien en cours...</div>`;

        try {
            const response = await fetch("/api/client/payment-link/generate", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    application_reference: reference,
                    identifier: identifier,
                    send_whatsapp: false
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                resultBox.innerHTML = `
                    <div style="padding:10px;border-radius:8px;background:#fff3cd;color:#664d03;">
                        ${data.detail || data.message || "Lien de paiement non disponible."}
                    </div>
                `;
                return;
            }

            if (data.status === "PAYMENT_ALREADY_CONFIRMED") {
                resultBox.innerHTML = `
                    <div style="padding:10px;border-radius:8px;background:#d1e7dd;color:#0f5132;">
                        ${data.message}
                    </div>
                `;
                return;
            }

            const link = data.payment && data.payment.full_payment_url ? data.payment.full_payment_url : "";

            resultBox.innerHTML = `
                <div style="padding:12px;border-radius:8px;background:#f8f9fa;">
                    <strong>Lien de paiement sécurisé Mastercard</strong><br>
                    <input id="clientPaymentGeneratedLink" value="${link}" readonly
                        style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:8px;">

                    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
                        <a href="${link}" target="_blank"
                           style="padding:10px 14px;border-radius:8px;background:#D22630;color:#fff;text-decoration:none;font-weight:700;">
                            Payer maintenant
                        </a>

                        <button type="button"
                            onclick="navigator.clipboard.writeText(document.getElementById('clientPaymentGeneratedLink').value).then(()=>alert('Lien copié'))"
                            style="padding:10px 14px;border:0;border-radius:8px;background:#444;color:#fff;font-weight:700;cursor:pointer;">
                            Copier le lien
                        </button>
                    </div>

                    <div style="margin-top:8px;color:#555;font-size:13px;">
                        Référence paiement : ${data.payment.payment_reference}<br>
                        Montant : ${data.payment.amount} ${data.payment.currency}
                    </div>
                </div>
            `;
        } catch (error) {
            resultBox.innerHTML = `
                <div style="padding:10px;border-radius:8px;background:#f8d7da;color:#842029;">
                    Erreur lors de la génération du lien. Veuillez réessayer.
                </div>
            `;
        }
    }

    function init() {
        const reference = findApplicationReference();

        if (!reference) {
            return;
        }

        const panel = createPaymentPanel(reference);

        const target =
            document.querySelector("main") ||
            document.querySelector(".container") ||
            document.body;

        target.appendChild(panel);

        document.getElementById("clientGeneratePaymentLinkBtn").addEventListener("click", generatePaymentLink);
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();
</script>

<script>
/* CLIENT_STATUS_PAYMENT_DISPLAY_V1 */
(function () {
    if (window.__clientStatusPaymentDisplayV1) return;
    window.__clientStatusPaymentDisplayV1 = true;

    function escapePaymentHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function moneyPayment(value, currency) {
        const n = Number(value || 0);
        return n.toLocaleString("fr-FR") + " " + (currency || "XAF");
    }

    function paymentLabel(app) {
        const required = app.selected_package_payment_required === true || app.selected_package_payment_required === "true";
        const status = app.package_payment_status || (required ? "PENDING" : "NOT_REQUIRED");

        if (!required) {
            return {
                label: "Paiement non requis",
                cls: "payment-free"
            };
        }

        if (status === "PAID") {
            return {
                label: "Paiement confirmé",
                cls: "payment-paid"
            };
        }

        if (status === "FAILED") {
            return {
                label: "Paiement échoué",
                cls: "payment-failed"
            };
        }

        return {
            label: "Paiement en attente",
            cls: "payment-pending"
        };
    }

    function buildPaymentBox(app) {
        const payment = paymentLabel(app);
        const required = app.selected_package_payment_required === true || app.selected_package_payment_required === "true";

        const packageAmount =
            Number(app.selected_package_opening_fee || 0) +
            Number(app.selected_package_subscription_fee || 0);

        const amount = app.package_payment_amount || packageAmount || 0;
        const currency = app.package_payment_currency || app.selected_package_currency || "XAF";

        let action = "";

        if (required && app.package_payment_status !== "PAID" && app.package_payment_url) {
            action = `
                <a class="payment-action" href="${escapePaymentHtml(app.package_payment_url)}">
                    Procéder / reprendre le paiement
                </a>
            `;
        }

        return `
            <div class="payment-status-box" data-payment-box="1">
                <h3>Package et paiement</h3>

                <span class="payment-badge ${payment.cls}">
                    ${escapePaymentHtml(payment.label)}
                </span>

                <div class="payment-grid">
                    <div class="payment-item">
                        <span>Package choisi</span>
                        <strong>${escapePaymentHtml(app.selected_package_name || app.selected_package_code || "Non renseigné")}</strong>
                    </div>

                    <div class="payment-item">
                        <span>Montant à payer</span>
                        <strong>${moneyPayment(amount, currency)}</strong>
                    </div>

                    <div class="payment-item">
                        <span>Référence paiement</span>
                        <strong>${escapePaymentHtml(app.package_payment_reference || "Non générée")}</strong>
                    </div>
                </div>

                ${action}
            </div>
        `;
    }

    function injectPaymentBox() {
        const resultBox = document.getElementById("statusResult");
        if (!resultBox) return;

        const progressBox = resultBox.querySelector(".tracking-progress-box");
        if (!progressBox) return;

        if (resultBox.querySelector('[data-payment-box="1"]')) return;

        const refEl = resultBox.querySelector(".tracking-ref");
        const ref = refEl ? refEl.textContent.trim() : "";

        const apps = window.__lastTrackingAppsV3 || [];
        const app = apps.find(x => String(x.reference || "").trim() === ref) || apps[0];

        if (!app) return;

        progressBox.insertAdjacentHTML("beforebegin", buildPaymentBox(app));
    }

    const observer = new MutationObserver(function () {
        setTimeout(injectPaymentBox, 80);
    });

    document.addEventListener("DOMContentLoaded", function () {
        const resultBox = document.getElementById("statusResult");

        if (resultBox) {
            observer.observe(resultBox, {
                childList: true,
                subtree: true
            });
        }
    });
})();
</script>

        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function money(value, currency) {
        const n = Number(value || 0);
        return n.toLocaleString("fr-FR") + " " + (currency || "XAF");
    }

    function getPackageAmount(app) {
        return (
            Number(app.package_payment_amount || 0) ||
            (
                Number(app.selected_package_opening_fee || 0) +
                Number(app.selected_package_subscription_fee || 0)
            )
        );
    }

    function isPaymentRequired(app) {
        const explicitRequired =
            app.selected_package_payment_required === true ||
            app.selected_package_payment_required === "true";

        const amount = getPackageAmount(app);

        return explicitRequired || amount > 0;
    }

    function getPaymentState(app) {
        const required = isPaymentRequired(app);
        const status = String(app.package_payment_status || "").toUpperCase();

        if (!required) {
            return {
                key: "free",
                label: "Paiement non requis",
                help: "Ce package ne nécessite pas de paiement immédiat."
            };
        }

        if (status === "PAID") {
            return {
                key: "paid",
                label: "Paiement confirmé",
                help: "Le paiement de la souscription a été confirmé."
            };
        }

        if (status === "FAILED") {
            return {
                key: "failed",
                label: "Paiement échoué",
                help: "Le paiement n’a pas été validé. Le client peut reprendre l’opération."
            };
        }

        if (app.package_payment_reference) {
            return {
                key: "pending",
                label: "Paiement en attente",
                help: "Votre dossier est en cours de traitement. Le paiement sera disponible uniquement après validation par la banque."
            };
        }

        return {
            key: "pending",
            label: "Paiement en attente de génération",
            help: "Le package est payant, mais aucune référence de paiement n’a encore été générée."
        };
    }

    function renderPaymentBoxV2(app) {
        const amount = getPackageAmount(app);
        const currency = app.package_payment_currency || app.selected_package_currency || "XAF";
        const state = getPaymentState(app);
        const required = isPaymentRequired(app);

        let action = "";

        if (required && state.key !== "paid" && app.package_payment_url) {
            action = `
                <a class="payment-action" href="${escapeHtml(app.package_payment_url)}">
                    Procéder / reprendre le paiement
                </a>
            `;
        }

        if (required && state.key !== "paid" && !app.package_payment_url) {
            action = `
                <button class="payment-action-secondary" type="button"
                        onclick="window.__generatePackagePaymentFromStatus('${escapeHtml(app.reference)}')">
                    Paiement en attente de validation
                </button>
            `;
        }

        return `
            <div class="payment-status-box" data-payment-box="1">
                <h3>Package et paiement</h3>

                <div class="payment-status-main ${state.key}">
                    Statut du paiement : ${escapeHtml(state.label)}
                    <br>
                    <small>${escapeHtml(state.help)}</small>
                </div>

                <div class="payment-grid">
                    <div class="payment-item">
                        <span>Package choisi</span>
                        <strong>${escapeHtml(app.selected_package_name || app.selected_package_code || "Non renseigné")}</strong>
                    </div>

                    <div class="payment-item">
                        <span>Montant à payer</span>
                        <strong>${money(amount, currency)}</strong>
                    </div>

                    <div class="payment-item">
                        <span>Référence paiement</span>
                        <strong>${escapeHtml(app.package_payment_reference || "Non générée")}</strong>
                    </div>
                </div>

                ${action}
            </div>
        `;
    }

    window.__generatePackagePaymentFromStatus = async function (reference) {
        const resultBox = document.getElementById("statusResult");

        try {
            const response = await fetch(`/api/payments/package/initiate/${encodeURIComponent(reference)}`, {
                method: "POST",
                cache: "no-store"
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Impossible de générer le paiement.");
            }

            const payment = data.payment;

            if (!payment) {
                throw new Error(data.message || "Aucun paiement généré.");
            }

            const apps = window.__lastTrackingAppsV3 || [];
            const app = apps.find(x => String(x.reference) === String(reference));

            if (app) {
                app.package_payment_reference = payment.payment_reference;
                app.package_payment_status = payment.status;
                app.package_payment_provider = payment.provider;
                app.package_payment_amount = payment.amount;
                app.package_payment_currency = payment.currency;
                app.package_payment_url = payment.payment_url;
            }

            const oldBox = resultBox ? resultBox.querySelector('[data-payment-box="1"]') : null;

            if (oldBox && app) {
                oldBox.outerHTML = renderPaymentBoxV2(app);
            }

        } catch (error) {
            alert(error.message || "Erreur lors de la génération du lien de paiement.");
        }
    };

    function injectPaymentBoxV2() {
        const resultBox = document.getElementById("statusResult");
        if (!resultBox) return;

        const progressBox = resultBox.querySelector(".tracking-progress-box");
        if (!progressBox) return;

        const refEl = resultBox.querySelector(".tracking-ref");
        const ref = refEl ? refEl.textContent.trim() : "";

        const apps = window.__lastTrackingAppsV3 || [];
        const app = apps.find(x => String(x.reference || "").trim() === ref) || apps[0];

        if (!app) return;

        const oldBox = resultBox.querySelector('[data-payment-box="1"]');

        if (oldBox) {
            oldBox.outerHTML = renderPaymentBoxV2(app);
        } else {
            progressBox.insertAdjacentHTML("beforebegin", renderPaymentBoxV2(app));
        }
    }

    const observer = new MutationObserver(function () {
        setTimeout(injectPaymentBoxV2, 120);
    });

    document.addEventListener("DOMContentLoaded", function () {
        const resultBox = document.getElementById("statusResult");

        if (resultBox) {
            observer.observe(resultBox, {
                childList: true,
                subtree: true
            });
        }
    });
})();
</script>

<script>
/* CLIENT_STATUS_PAYMENT_CLICK_FIX_V3 */
(function () {
    if (window.__clientStatusPaymentClickFixV3) return;
    window.__clientStatusPaymentClickFixV3 = true;

    async function generatePayment(reference, button) {
        if (!reference) {
            alert("Référence dossier introuvable.");
            return;
        }

        const originalText = button ? button.textContent : "";

        if (button) {
            button.disabled = true;
            button.textContent = "Génération du lien...";
        }

        try {
            const response = await fetch(`/api/payments/package/initiate/${encodeURIComponent(reference)}`, {
                method: "POST",
                cache: "no-store"
            });

            let data = null;

            try {
                data = await response.json();
            } catch (e) {
                throw new Error("Réponse serveur invalide.");
            }

            if (!response.ok) {
                throw new Error(data.detail || "Impossible de générer le paiement.");
            }

            if (!data.payment) {
                throw new Error(data.message || "Aucun paiement généré.");
            }

            const payment = data.payment;

            const apps = window.__lastTrackingAppsV3 || [];
            const app = apps.find(x => String(x.reference || "") === String(reference));

            if (app) {
                app.package_payment_reference = payment.payment_reference;
                app.package_payment_status = payment.status;
                app.package_payment_provider = payment.provider;
                app.package_payment_amount = payment.amount;
                app.package_payment_currency = payment.currency;
                app.package_payment_url = payment.payment_url;
            }

            if (button) {
                button.textContent = "Lien généré. Ouverture...";
            }

            if (payment.payment_url) {
                window.location.href = payment.payment_url;
            } else {
                alert("Lien de paiement généré : " + payment.payment_reference);
                window.location.reload();
            }

        } catch (error) {
            alert(error.message || "Erreur lors de la génération du lien de paiement.");

            if (button) {
                button.disabled = false;
                button.textContent = originalText || "Paiement en attente de validation";
            }
        }
    }

    window.__generatePackagePaymentFromStatus = function (reference) {
        const button = document.activeElement;
        generatePayment(reference, button);
    };

    document.addEventListener("click", function (event) {
        const button = event.target.closest(".payment-action-secondary");

        if (!button) return;

        const text = (button.textContent || "").toLowerCase();

        if (!text.includes("générer") && !text.includes("generer")) return;

        event.preventDefault();
        event.stopImmediatePropagation();

        const resultBox = document.getElementById("statusResult");
        const refEl = resultBox ? resultBox.querySelector(".tracking-ref") : null;
        const reference = refEl ? refEl.textContent.trim() : "";

        generatePayment(reference, button);
    }, true);
})();
</script>

<script>

(function () {
    if (window.__noClientPaymentGenerationV5) return;
    window.__noClientPaymentGenerationV5 = true;

    // Sécurité côté interface : le client ne crée plus le paiement.
    window.__generatePackagePaymentFromStatus = function () {
        alert("Le lien de paiement est généré par la banque après validation du dossier.");
    };

    function removeClientGenerateButtons() {
        document.querySelectorAll(".payment-action-secondary").forEach(function (button) {
            const text = (button.textContent || "").toLowerCase();

            if (text.includes("générer") || text.includes("generer")) {
                const box = button.closest(".payment-status-box");

                button.remove();

                if (box && !box.querySelector(".payment-wait-bank")) {
                    box.insertAdjacentHTML(
                        "beforeend",

                    );
                }
            }
        });
    }

    const observer = new MutationObserver(function () {
        setTimeout(removeClientGenerateButtons, 80);
    });

    document.addEventListener("DOMContentLoaded", function () {
        removeClientGenerateButtons();

        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    });
})();
</script>

<script>
(function () {
  const MARKER = "CLIENT_STATUS_OPENED_ACCOUNT_DISPLAY_V1";

  if (window.__clientStatusOpenedAccountV1Loaded) {
    return;
  }

  window.__clientStatusOpenedAccountV1Loaded = true;

  const processed = new Set();

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function findEmailValue() {
    const inputs = Array.from(document.querySelectorAll("input"));

    const emailInput = inputs.find(input => {
      const type = String(input.type || "").toLowerCase();
      const name = String(input.name || input.id || input.placeholder || "").toLowerCase();

      return type === "email" || name.includes("email") || name.includes("mail");
    });

    if (emailInput && emailInput.value && emailInput.value.includes("@")) {
      return emailInput.value.trim();
    }

    const anyWithEmail = inputs.find(input => String(input.value || "").includes("@"));

    if (anyWithEmail) {
      return anyWithEmail.value.trim();
    }

    // Recherche par téléphone : on récupère l'email depuis les dossiers déjà trouvés.
    const apps = window.__lastTrackingAppsV3 || [];
    const fromApps = apps.map(a => a && a.email).find(e => e && String(e).includes("@"));

    return fromApps ? String(fromApps).trim() : "";
  }

  function extractReferences() {
    const text = document.body.innerText || "";
    const matches = text.match(/DIA-\d{8}-[A-Z0-9]+/g) || [];

    return Array.from(new Set(matches));
  }

  function findCardForReference(reference) {
    const all = Array.from(document.querySelectorAll("section, article, .card, .status-card, .application-card, .result-card, div"));

    const candidates = all.filter(el => {
      const text = el.innerText || "";
      return text.includes(reference) && text.length < 4000;
    });

    if (!candidates.length) {
      return null;
    }

    candidates.sort((a, b) => {
      return (a.innerText || "").length - (b.innerText || "").length;
    });

    return candidates[0];
  }

  function renderOpenedAccount(account) {
    const accountNumber = account.account_number || "Non renseigné";
    const rib = account.rib || "Non renseigné";
    const message = account.message_to_client || "Votre compte a été ouvert par la banque.";
    const paymentStatus = account.payment_status || "PAID";

    return `
      <div class="client-opened-account-v1" data-opened-account-ref="${escapeHtml(account.application_reference)}">
        <span class="client-opened-account-badge-v1">Compte ouvert</span>
        <h4>Informations finales du compte</h4>

        <div class="client-opened-account-grid-v1">
          <div class="client-opened-account-item-v1">
            <strong>Référence dossier</strong>
            ${escapeHtml(account.application_reference)}
          </div>

          <div class="client-opened-account-item-v1">
            <strong>Statut paiement</strong>
            ${escapeHtml(paymentStatus)}
          </div>

          <div class="client-opened-account-item-v1">
            <strong>Numéro de compte</strong>
            ${escapeHtml(accountNumber)}
          </div>

          <div class="client-opened-account-item-v1 client-opened-account-full-v1">
            <strong>RIB final Afriland</strong>
            ${escapeHtml(rib)}
          </div>

          <div class="client-opened-account-item-v1 client-opened-account-full-v1">
            <strong>Message de la banque</strong>
            ${escapeHtml(message)}
          </div>
        </div>
      </div>
    `;
  }

  async function injectOpenedAccount(reference, email) {
    const key = reference + "|" + email;

    if (processed.has(key)) {
      return;
    }

    processed.add(key);

    try {
      const response = await fetch(
        `/api/applications/${encodeURIComponent(reference)}/opened-account-public?email=${encodeURIComponent(email)}&v=${Date.now()}`
      );

      if (!response.ok) {
        return;
      }

      const account = await response.json();

      const card = findCardForReference(reference);

      if (!card) {
        return;
      }

      if (card.querySelector(`[data-opened-account-ref="${CSS.escape(reference)}"]`)) {
        return;
      }

      card.insertAdjacentHTML("beforeend", renderOpenedAccount(account));
    } catch (error) {
      console.warn("Opened account display:", error);
    }
  }

  function refreshOpenedAccounts() {
    const email = findEmailValue();

    if (!email) {
      return;
    }

    const references = extractReferences();

    references.forEach(reference => {
      injectOpenedAccount(reference, email);
    });
  }

  function startObserver() {
    refreshOpenedAccounts();

    const observer = new MutationObserver(function () {
      refreshOpenedAccounts();
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });

    setInterval(refreshOpenedAccounts, 2000);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startObserver);
  } else {
    startObserver();
  }
})();
</script>
