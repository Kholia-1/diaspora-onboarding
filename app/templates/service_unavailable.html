<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service en préparation</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7eeee;
            color: #1f1719;
        }

        .wrap {
            min-height: 100vh;
            max-width: 520px;
            margin: 0 auto;
            padding: 36px 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            background: #fff;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.08);
            border: 1px solid #ead8d8;
        }

        .icon {
            width: 70px;
            height: 70px;
            border-radius: 22px;
            background: #C90000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            color: #7a686d;
            line-height: 1.55;
            font-size: 16px;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            padding: 13px 18px;
            background: #C90000;
            color: #fff;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
    <link rel="stylesheet" href="/static/css/premium.css?v=1">
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="icon">⏳</div>
        <h1>Service en préparation</h1>
        <p>Ce service sera relié au portail dès que le lien ou le module correspondant sera disponible.</p>
        <a href="/?v=24">Retour à l’accueil</a>
    </div>
</div>
</body>
</html>
