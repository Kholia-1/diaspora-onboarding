<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Journal d'audit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --red: #C90000;
            --red-dark: #9E0000;
            --black: #111111;
            --white: #FFFFFF;
            --gray-bg: #F4F6F9;
            --border: #DADDE5;
            --muted: #6B7280;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--gray-bg);
            color: #111827;
        }

        .header {
            background: var(--black);
            color: var(--white);
            padding: 18px 30px;
            border-bottom: 4px solid var(--red);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1150px;
            margin: 25px auto;
            background: var(--white);
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: var(--red);
        }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .filters input, .filters select {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            min-width: 200px;
        }

        button {
            background: var(--red);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: var(--red-dark);
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--black);
            color: white;
            padding: 12px;
            text-align: left;
            white-space: nowrap;
        }

        td {
            border-bottom: 1px solid var(--border);
            padding: 10px;
            vertical-align: top;
            font-size: 14px;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            background: #EEF2FF;
            color: #3730A3;
            white-space: nowrap;
        }

        .muted {
            color: var(--muted);
            font-size: 12px;
        }

        .details-cell {
            max-width: 340px;
            word-break: break-word;
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 30px 0;
        }

        @media (max-width: 700px) {
            .filters input, .filters select {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <strong>Back-office — Journal d'audit</strong>
    <a href="/backoffice/applications">← Retour aux demandes</a>
</div>

<div class="container">
    <h1>Journal des actions utilisateurs</h1>
    <p class="muted">
        Trace des actions réalisées dans l'application : décisions back-office,
        modifications de configuration, soumissions de dossiers.
    </p>

    <div class="filters">
        <input id="filterActor" type="text" placeholder="Filtrer par utilisateur (ex : agent KYC)">
        <select id="filterAction">
            <option value="">Toutes les actions</option>
            <option value="APPLICATION_SUBMITTED">Soumission de dossier</option>
            <option value="APPLICATION_DECISION">Décision back-office</option>
            <option value="PACKAGES_CONFIG_UPDATED">Configuration des packages</option>
            <option value="API_INTEGRATIONS_UPDATED">Configuration des intégrations API</option>
        </select>
        <button id="refreshBtn" type="button">Actualiser</button>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Utilisateur</th>
                    <th>Action</th>
                    <th>Ressource</th>
                    <th>Détails</th>
                    <th>IP</th>
                </tr>
            </thead>
            <tbody id="logsBody">
                <tr><td colspan="6" class="empty">Chargement...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function escapeHtml(value) {
        return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function formatDate(iso) {
        if (!iso) return "—";
        try {
            return new Date(iso).toLocaleString("fr-FR");
        } catch (err) {
            return iso;
        }
    }

    function formatDetails(raw) {
        if (!raw) return "—";
        try {
            const parsed = JSON.parse(raw);
            return Object.keys(parsed)
                .filter(function (key) { return parsed[key] !== null && parsed[key] !== ""; })
                .map(function (key) { return "<strong>" + escapeHtml(key) + "</strong> : " + escapeHtml(JSON.stringify(parsed[key])); })
                .join("<br>") || "—";
        } catch (err) {
            return escapeHtml(raw);
        }
    }

    async function loadLogs() {
        const body = document.getElementById("logsBody");
        body.innerHTML = '<tr><td colspan="6" class="empty">Chargement...</td></tr>';

        const params = new URLSearchParams();
        const actor = document.getElementById("filterActor").value.trim();
        const action = document.getElementById("filterAction").value;

        if (actor) params.set("actor", actor);
        if (action) params.set("action", action);

        try {
            const response = await fetch("/api/backoffice/audit-logs?" + params.toString());
            const data = await response.json();

            if (!response.ok || !data.ok) {
                throw new Error("Réponse invalide du serveur.");
            }

            if (!data.logs.length) {
                body.innerHTML = '<tr><td colspan="6" class="empty">Aucune action enregistrée pour le moment.</td></tr>';
                return;
            }

            body.innerHTML = data.logs.map(function (log) {
                const resource = log.resource_type
                    ? escapeHtml(log.resource_type) + (log.resource_id ? " #" + escapeHtml(log.resource_id) : "")
                    : "—";

                return "<tr>" +
                    "<td>" + escapeHtml(formatDate(log.created_at)) + "</td>" +
                    "<td>" + escapeHtml(log.actor || "anonyme") + "</td>" +
                    '<td><span class="badge">' + escapeHtml(log.action) + "</span></td>" +
                    "<td>" + resource + "</td>" +
                    '<td class="details-cell">' + formatDetails(log.details) + "</td>" +
                    "<td>" + escapeHtml(log.ip_address || "—") + "</td>" +
                    "</tr>";
            }).join("");

        } catch (err) {
            body.innerHTML = '<tr><td colspan="6" class="empty">Erreur de chargement du journal.</td></tr>';
        }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadLogs);
    document.getElementById("filterActor").addEventListener("keyup", function (event) {
        if (event.key === "Enter") loadLogs();
    });
    document.getElementById("filterAction").addEventListener("change", loadLogs);

    loadLogs();
</script>

</body>
</html>
