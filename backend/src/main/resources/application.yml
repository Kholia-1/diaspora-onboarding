spring:
  application:
    name: diaspora-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/diaspora
    username: postgres
    password: ""

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jackson:
    # Sérialisation JSON en snake_case — parité avec les payloads FastAPI.
    property-naming-strategy: SNAKE_CASE
    # NB : avec Jackson 3 (Spring Boot 4), les dates java.time sont sérialisées en ISO-8601
    # par défaut (WRITE_DATES_AS_TIMESTAMPS désactivé d'office).

  session:
    jdbc:
      initialize-schema: always
    timeout: 12h

  servlet:
    multipart:
      # Uploads pré-onboarding : documents et vidéos jusqu'à 60 Mo (parité legacy).
      max-file-size: 64MB
      max-request-size: 64MB

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  storage:
    # Racine du dépôt : les file_path stockés en base y sont relatifs.
    base-dir: "c:/Users/daniel_dzangue/Documents/compte diaspora/diaspora-onboarding"
  fernet:
    # Utilisé seulement si la variable d'environnement FERNET_KEY est absente.
    key-file: "${app.storage.base-dir}/.fernet_key"
  blackmodule:
    # Vide en dev : le screening retourne BLACKMODULE_UNAVAILABLE (fail-safe).
    # La variable d'environnement BLACKMODULE_SCREENING_URL reste prioritaire.
    screening-url: ""
  ocr:
    # Microservice OCR interne (Phase 3). Les variables d'env OCR_SERVICE_* restent prioritaires.
    base-url: "${OCR_SERVICE_BASE_URL:http://127.0.0.1:8020}"
    api-key: "${OCR_SERVICE_API_KEY:}"
    timeout-seconds: 30
  pre-onboarding:
    # Dossier d'upload des fichiers de session (résolu contre storage.base-dir s'il est relatif).
    upload-dir: "${PRE_ONBOARDING_UPLOAD_DIR:uploads/pre_onboarding}"
    otp:
      ttl-minutes: "${PRE_ONBOARDING_OTP_TTL_MINUTES:10}"
      max-attempts: "${PRE_ONBOARDING_OTP_MAX_ATTEMPTS:5}"
      # Mode démo : le code n'est pas réellement envoyé mais exposé dans la réponse (E2E vérifiable).
      demo-mode: "${PRE_ONBOARDING_OTP_DEMO_MODE:true}"
      secret: "${PRE_ONBOARDING_OTP_SECRET:diaspora-onboarding-demo-secret-change-me}"
      # Affichage du code à l'écran si l'envoi WhatsApp échoue (contournement legacy).
      fallback-display: "${PRE_ONBOARDING_OTP_FALLBACK_DISPLAY:true}"
