spring:
  application:
    name: diaspora-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/diaspora
    username: postgres
    password: ""

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jackson:
    # Sérialisation JSON en snake_case — parité avec les payloads FastAPI.
    property-naming-strategy: SNAKE_CASE
    # NB : avec Jackson 3 (Spring Boot 4), les dates java.time sont sérialisées en ISO-8601
    # par défaut (WRITE_DATES_AS_TIMESTAMPS désactivé d'office).

  session:
    jdbc:
      initialize-schema: always
    timeout: 12h

  servlet:
    multipart:
      # Uploads pré-onboarding : documents et vidéos jusqu'à 60 Mo (parité legacy).
      max-file-size: 64MB
      max-request-size: 64MB

  mail:
    # Compte de la banque via Office 365 : la boîte agent_dri_03 est hébergée sur
    # Exchange Online (smtp.office365.com), PAS sur l'Exchange interne yde-exc01
    # (qui refuse son auth en 535). Auth + envoi externe testés OK le 2026-07-14.
    host: "${SMTP_HOST:smtp.office365.com}"
    port: "${SMTP_PORT:587}"
    username: "${SMTP_USER:agent_dri_03@afrilandfirstbank.com}"
    password: "${SMTP_PASSWORD:KSGFMapuss@PASSE03}"
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  storage:
    # Racine du dépôt : les file_path stockés en base y sont relatifs.
    base-dir: "c:/Users/daniel_dzangue/Documents/compte diaspora/diaspora-onboarding"
  fernet:
    # Utilisé seulement si la variable d'environnement FERNET_KEY est absente.
    key-file: "${app.storage.base-dir}/.fernet_key"
  blackmodule:
    # Vide en dev : le screening retourne BLACKMODULE_UNAVAILABLE (fail-safe).
    # La variable d'environnement BLACKMODULE_SCREENING_URL reste prioritaire.
    screening-url: ""
  ocr:
    # Microservice OCR interne (Phase 3). Les variables d'env OCR_SERVICE_* restent prioritaires.
    base-url: "${OCR_SERVICE_BASE_URL:http://127.0.0.1:8020}"
    api-key: "${OCR_SERVICE_API_KEY:}"
    timeout-seconds: 30
  pre-onboarding:
    # Dossier d'upload des fichiers de session (résolu contre storage.base-dir s'il est relatif).
    upload-dir: "${PRE_ONBOARDING_UPLOAD_DIR:uploads/pre_onboarding}"
    otp:
      ttl-minutes: "${PRE_ONBOARDING_OTP_TTL_MINUTES:10}"
      max-attempts: "${PRE_ONBOARDING_OTP_MAX_ATTEMPTS:5}"
      # Mode démo : le code n'est pas réellement envoyé mais exposé dans la réponse (E2E vérifiable).
      demo-mode: "${PRE_ONBOARDING_OTP_DEMO_MODE:true}"
      secret: "${PRE_ONBOARDING_OTP_SECRET:diaspora-onboarding-demo-secret-change-me}"
      # Affichage du code à l'écran si l'envoi WhatsApp échoue (contournement legacy).
      fallback-display: "${PRE_ONBOARDING_OTP_FALLBACK_DISPLAY:true}"
  # Base publique (liens de paiement, callbacks). Parité PUBLIC_BASE_URL du monolithe.
  public-base-url: "${PUBLIC_BASE_URL:https://onboarding.afb-firstagent.com}"
  # Dossier de stockage des documents chiffrés (.enc) de dossier (résolu contre storage.base-dir
  # s'il est relatif). Parité UPLOAD_DIR="uploads" du monolithe.
  application-upload-dir: "${APPLICATION_UPLOAD_DIR:uploads}"
  mail:
    # Notifications email (spring.mail ci-dessus). Canal réel actif par défaut depuis le
    # 2026-07-14 (mot de passe d'application Gmail validé, envoi testé SENT). Mettre
    # SMTP_ENABLED=false pour revenir à l'adapter NoOp (log sans envoi).
    enabled: "${SMTP_ENABLED:true}"
    from: "${SMTP_FROM:agent_dri_03@afrilandfirstbank.com}"
  callbell:
    # Notifications WhatsApp via Callbell. Désactivé par défaut en dev → l'adapter NoOp
    # reste actif (aucun message envoyé). Passer CALLBELL_ENABLED=true pour le canal réel.
    # Mémoire projet : texte libre (use-template=false) car blocage Meta 131042 sur templates.
    enabled: "${CALLBELL_ENABLED:false}"
    base-url: "${CALLBELL_BASE_URL:https://api.callbell.eu}"
    api-token: "${CALLBELL_API_TOKEN:}"
    channel-uuid: "${CALLBELL_CHANNEL_UUID:}"
    template-uuid: "${CALLBELL_TEMPLATE_UUID:}"
    use-template: "${CALLBELL_USE_TEMPLATE:false}"
    default-country-code: "${CALLBELL_DEFAULT_COUNTRY_CODE:+237}"
  mastercard:
    # Passerelle Hosted Checkout. Désactivé par défaut : les endpoints répondent en mode
    # dégradé tant que MASTERCARD_ENABLED n'est pas true et les secrets non fournis.
    enabled: "${MASTERCARD_ENABLED:false}"
    environment: "${MASTERCARD_ENVIRONMENT:TEST}"
    base-url: "${MASTERCARD_GATEWAY_BASE_URL:}"
    merchant-id: "${MASTERCARD_MERCHANT_ID:}"
    api-password: "${MASTERCARD_API_PASSWORD:}"
    api-version: "${MASTERCARD_API_VERSION:100}"
    currency: "${MASTERCARD_CURRENCY:XAF}"
    operation: "${MASTERCARD_OPERATION:PURCHASE}"
    merchant-name: "${MASTERCARD_MERCHANT_NAME:Afriland First Bank}"
    merchant-url: "${MASTERCARD_MERCHANT_URL:}"
    return-url: "${MASTERCARD_RETURN_URL:}"
    webhook-url: "${MASTERCARD_WEBHOOK_URL:}"
